<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TALK SKY - オンラインフライト</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87b7e8;
    font-family: system-ui, sans-serif;
  }
  
  #mode-selector {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#1c3a5e88, #0d1b2a99);
    z-index: 20;
  }
  
  #mode-panel {
    background: #101d2cee;
    border: 1px solid #3a5a7a;
    border-radius: 14px;
    padding: 40px;
    color: #dce9f5;
    width: 360px;
    box-shadow: 0 12px 40px #0008;
    text-align: center;
  }
  
  #mode-panel h1 {
    margin: 0 0 8px;
    font-size: 28px;
    letter-spacing: 2px;
    color: #7ec8ff;
  }
  
  #mode-panel p {
    margin: 0 0 28px;
    font-size: 13px;
    color: #8aa5bd;
    line-height: 1.6;
  }
  
  .mode-buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  
  .mode-btn {
    flex: 1;
    padding: 16px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    transition: all 0.2s;
  }
  
  .mode-btn.pc {
    background: #2f8fe0;
    color: #fff;
  }
  
  .mode-btn.pc:hover {
    background: #4aa3ee;
  }
  
  .mode-btn.mobile {
    background: #41b06b;
    color: #fff;
  }
  
  .mode-btn.mobile:hover {
    background: #52c77a;
  }
  
  #game-container {
    display: none;
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
  }
  
  #game-container canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  #menu {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(#1c3a5e88, #0d1b2a99);
    z-index: 10;
  }
  
  #panel {
    background: #101d2cee;
    border: 1px solid #3a5a7a;
    border-radius: 14px;
    padding: 28px 32px;
    color: #dce9f5;
    width: 320px;
    box-shadow: 0 12px 40px #0008;
  }
  
  #panel h1 {
    margin: 0 0 4px;
    font-size: 26px;
    letter-spacing: 2px;
    color: #7ec8ff;
  }
  
  #panel p.sub {
    margin: 0 0 18px;
    font-size: 12px;
    color: #8aa5bd;
  }*

