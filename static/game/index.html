<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>TALK SKY - オンラインフライト</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#87b7e8;font-family:system-ui,sans-serif}
  canvas{display:block}
  #menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1c3a5e88,#0d1b2a99);z-index:10}
  #panel{background:#101d2cee;border:1px solid #3a5a7a;border-radius:14px;padding:28px 32px;color:#dce9f5;width:320px;box-shadow:0 12px 40px #0008}
  #panel h1{margin:0 0 4px;font-size:26px;letter-spacing:2px;color:#7ec8ff}
  #panel p.sub{margin:0 0 18px;font-size:12px;color:#8aa5bd}
  #panel input{width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:1px solid #3a5a7a;background:#0a1622;color:#dce9f5;font-size:14px}
  #panel button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;cursor:pointer;background:#2f8fe0;color:#fff;font-size:15px;font-weight:700}
  #panel button:hover{background:#4aa3ee}
  #help{margin-top:16px;font-size:12px;color:#8aa5bd;line-height:1.7}
  #hud{position:fixed;left:14px;bottom:12px;color:#fff;font:13px/1.6 ui-monospace,monospace;text-shadow:0 1px 3px #000a;z-index:5;pointer-events:none}
  #roster{position:fixed;right:14px;top:12px;color:#fff;font:13px/1.7 ui-monospace,monospace;text-align:right;text-shadow:0 1px 3px #000a;z-index:5;pointer-events:none}
  #toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#c0392bdd;color:#fff;padding:8px 18px;border-radius:8px;font-size:13px;display:none;z-index:20}
  #leaveBtn{position:fixed;left:14px;top:12px;z-index:6;display:none;padding:6px 14px;border:0;border-radius:8px;background:#ffffff2e;color:#fff;cursor:pointer;font-size:12px}
</style>
<script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="menu">
  <div id="panel">
    <h1>TALK SKY</h1>
    <p class="sub">talk-ch.com オンラインフライト — </p>
    <input id="nameInput" maxlength="16" placeholder="パイロット名">
    <input id="roomInput" maxlength="24" placeholder="ルーム名 (例: sky1)">
    <button id="joinBtn">出発する</button>
    <div id="help">
      W / S : 加速・減速<br>
      ↑ / ↓ : 上昇・下降<br>
      A / D : 左右旋回(バンク)<br>
      ※スマホ対応は 次回アップデート で追加予定
    </div>
  </div>
</div>
<button id="leaveBtn">退出</button>
<div id="hud"></div>
<div id="roster"></div>
<div id="toast"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
