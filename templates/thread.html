<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ thread.title }}</title>
    <style>
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; }
        a:link { color: #0000ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        form { background-color: #f0f0f0; border: 2px outset #ccc; padding: 15px; width: 450px; margin-top: 30px; }
        .post-meta { font-weight: bold; }
        .post-num { color: green; }
        .post-name { color: blue; }
        .admin-name { color: red; font-weight: bold; }
        .post-id { color: gray; font-size: 13px; font-weight: normal; }
        .post-content { margin-left: 2em; margin-top: 5px; white-space: pre-wrap; }
        .anchor-link { color: #ff00ff !important; font-weight: bold; }
        
        /* 🗑 削除ボタンのレトロなスタイル */
        .delete-btn {
            background-color: #ffcccc;
            color: #cc0000;
            border: 1px solid #cc0000;
            border-radius: 3px;
            font-size: 11px;
            padding: 1px 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .delete-btn:hover { background-color: #ff9999; }
        .delete-form { display: inline; background: none; border: none; padding: 0; margin: 0; width: auto; }
    </style>
</head>
<body>

    <a href="{{ url_for('index') }}">■板一覧に戻る</a>
    
    <h1>{{ thread.title }}</h1>
    <hr>

    <div id="post-container">
        {% for reply in thread.replies %}
        <div class="post-item" id="p{{ reply.id }}" data-id="{{ reply.id }}">
            <span class="post-meta">
                <span class="post-num">{{ reply.id }}</span> ：
                <span class="{% if reply.is_admin %}admin-name{% else %}post-name{% endif %}">{{ reply.author }}</span> ：
                {{ reply.date }}
                <span class="post-id"> ID:{{ reply.user_id }}</span>
                
                <!-- 👑 管理者だけに削除ボタンを表示 -->
                {% if is_admin_user and reply.author != "あぼーん" %}
                <form class="delete-form" action="/thread/{{ thread.id }}/delete/{{ reply.id }}" method="POST" onsubmit="return confirm('このレスを本当に削除しますか？');">
                    <button type="submit" class="delete-btn">削除</button>
                </form>
                {% endif %}
            </span>
            <p class="post-content">{{ reply.content }}</p>
            <hr>
        </div>
        {% endfor %}
    </div>

    <form action="{{ url_for('thread_view', thread_id=thread.id) }}" method="POST">
        <h3>この板に書き込む</h3>
        名前：<input type="text" name="author" placeholder="名前#パスワード で管理者化"><br><br>
        本文：<br>
        <textarea name="content" rows="5" cols="50" placeholder="メッセージを入力" required></textarea><br><br>
        <button type="submit">書き込む</button>
    </form>

    <script>
        const threadId = {{ thread.id }};
        // 現在この画面を見ている人が管理者かどうか（HTMLからJavaScriptに引き継ぐ）
        let isAdminView = {{ 'true' if is_admin_user else 'false' }};

        function convertAnchors(element) {
            const rawText = element.innerText;
            const regex = /&gt;&gt;(\d+)|>>(\d+)/g;
            const html = rawText.replace(regex, (match, p1, p2) => {
                const num = p1 || p2;
                return `<a href="#p${num}" class="anchor-link">>>${num}</a>`;
            });
            element.innerHTML = html;
        }

        document.querySelectorAll('.post-content').forEach(convertAnchors);
        
        setInterval(async () => {
            const postItems = document.querySelectorAll('.post-item');
            let lastId = 0;
            if (postItems.length > 0) {
                lastId = parseInt(postItems[postItems.length - 1].getAttribute('data-id'));
            }
            
            try {
                const response = await fetch(`/api/thread/${threadId}/updates?last_id=${lastId}`);
                const data = await response.json();
                
                // 管理者状態が更新されていれば上書き
                if (data.is_admin_user !== undefined) {
                    isAdminView = data.is_admin_user;
                }
                
                data.replies.forEach(reply => {
                    const container = document.getElementById('post-container');
                    const newDiv = document.createElement('div');
                    newDiv.className = 'post-item';
                    newDiv.id = `p${reply.id}`;
                    newDiv.setAttribute('data-id', reply.id);
                    
                    const nameClass = reply.is_admin ? 'admin-name' : 'post-name';
                    
                    // 新しく降ってきたレス用の削除ボタンHTML
                    let deleteButtonHtml = '';
                    if (isAdminView && reply.author !== 'あぼーん') {
                        deleteButtonHtml = `
                            <form class="delete-form" action="/thread/${threadId}/delete/${reply.id}" method="POST" onsubmit="return confirm('このレスを本当に削除しますか？');">
                                <button type="submit" class="delete-btn">削除</button>
                            </form>
                        `;
                    }
                    
                    newDiv.innerHTML = `
                        <span class="post-meta">
                            <span class="post-num">${reply.id}</span> ：
                            <span class="${nameClass}">${reply.author}</span> ：
                            ${reply.date}
                            <span class="post-id"> ID:${reply.user_id}</span>
                            ${deleteButtonHtml}
                        </span>
                        <p class="post-content">${reply.content}</p>
                        <hr>
                    `;
                    
                    const contentEl = newDiv.querySelector('.post-content');
                    convertAnchors(contentEl);
                    container.appendChild(newDiv);
                });
            } catch (error) {
                console.error("更新の取得に失敗しました:", error);
            }
        }, 2000);
    </script>

</body>
</html>
