<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
    <title>{{ thread.title }}</title>

    <style>
        html, body { 
            height: 100% !important;
            margin: 0 !important; 
            padding: 0 !important; 
            overflow: hidden !important; 
            background-color: #efefef; 
            font-family: "MS P Gothic", sans-serif; 
        }
        
        .header-area { 
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            padding: 5px 20px !important; 
            background-color: #efefef; 
            border-bottom: 1px solid #ccc; 
            height: 60px !important; 
            box-sizing: border-box !important; 
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            z-index: 1000 !important; 
        }
        .header-area h1 { margin: 0 !important; font-size: 20px !important; line-height: 1.2 !important; color: #000; }
        .header-links { font-size: 13px !important; margin-top: 3px !important; }

        #post-container { 
            position: absolute !important;
            top: 60px !important; 
            bottom: 160px !important; 
            left: 0 !important;
            width: 100% !important;
            overflow-y: scroll !important; 
            padding: 20px !important; 
            box-sizing: border-box !important; 
            background-color: #efefef;
            scroll-behavior: smooth;
        }

        .post-item { margin-bottom: 15px; }
        .post-meta { font-size: 13px; color: #666; }
        .post-num { font-weight: bold; color: #000; }
        .post-name { font-weight: bold; color: #117743; }
        .admin-name { font-weight: bold; color: #ff0000 !important; }
        .post-id { font-size: 11px; color: #888; }
        
        .post-content { 
            margin: 5px 0 5px 2em; 
            font-size: 14px; 
            line-height: 1.5; 
            word-break: break-all;
            white-space: pre-wrap;
        }

        .anchor-link {
            color: #0000ff;
            text-decoration: underline;
            cursor: pointer;
        }

        .uploaded-image {
            max-width: 250px;
            max-height: 250px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: block;
        }

        .form-area { 
            position: absolute !important;
            bottom: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 160px !important; 
            background-color: #efefef; 
            border-top: 1px solid #ccc; 
            padding: 10px 20px !important; 
            box-sizing: border-box !important; 
            z-index: 1000 !important; 
        }

        .form-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .form-row input[type="text"] { font-size: 12px; padding: 2px 5px; border: 1px solid #999; }
        .form-row textarea { width: 100%; height: 50px; font-size: 13px; border: 1px solid #999; resize: none; }
        .submit-btn { font-size: 12px; padding: 3px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-area">
        <h1>{{ thread.title }}</h1>
        <div class="header-links">
            <a href="{{ url_for('index') }}">■掲示板に戻る</a>
            <span style="margin-left: 15px; color: #666; font-size: 12px;">
                現在の閲覧者数: <strong id="active-user-count" style="color: #0088cc;">{{ active_count }}</strong>人
            </span>
        </div>
    </div>

    <div id="post-container">
        {% for reply in thread.replies %}
        <div class="post-item" id="p{{ loop.index }}" data-id="{{ reply.id }}">
            <span class="post-meta">
                <span class="post-num">{{ loop.index }}</span> ：
                <span class="{% if reply.is_admin %}admin-name{% else %}post-name{% endif %}">{{ reply.author }}</span> ：
                {{ reply.date }}
                <span class="post-id"> ID:{{ reply.user_id }}</span>

                {% if is_admin_user %}
                <form action="/thread/{{ thread.id }}/delete_reply/{{ reply.id }}" method="POST" style="display: inline; margin-left: 10px;" onsubmit="return confirm('このレスを削除しますか？');">
                    <button type="submit" style="background-color: #ffcccc; color: #cc0000; border: 1px solid #cc0000; border-radius: 3px; font-size: 10px; padding: 1px 5px; cursor: pointer;">削除</button>
                </form>
                {% endif %}
            </span>
            <p class="post-content">{{ reply.content|safe }}</p>
            
            {% if reply.image_url %}
            <div style="margin-left: 2em;">
                <img src="{{ reply.image_url }}" class="uploaded-image" alt="添付画像">
            </div>
            {% endif %}
            <hr style="border:0; border-top:1px solid #ccc;">
        </div>
        {% endfor %}
    </div>

    <div class="form-area">
        <form action="/thread/{{ thread.id }}/post_reply" method="POST" enctype="multipart/form-data">
            <div class="form-row">
                <label>名前:</label>
                <input type="text" name="author" value="名無しさん" style="width: 150px;">
                <input type="file" name="image" accept="image/*" style="font-size: 11px;">
                <button type="submit" class="submit-btn">書き込む</button>
            </div>
            <div class="form-row">
                <textarea name="content" placeholder="コメントを入力..." required></textarea>
            </div>
        </form>
    </div>

    <script>
        let lastReplyId = 0;
        const replyItems = document.querySelectorAll('.post-item');
        if (replyItems.length > 0) {
            lastReplyId = parseInt(replyItems[replyItems.length - 1].getAttribute('data-id')) || 0;
        }

        function scrollToBottom() {
            const container = document.getElementById('post-container');
            container.scrollTop = container.scrollHeight;
        }

        window.onload = function() {
            scrollToBottom();
        };

        function processPostContent(element) {
            let text = element.innerHTML;
            const anchorRegex = /(?:&gt;&gt;|>>)(\d+)/g;
            text = text.replace(anchorRegex, (match, num) => {
                return `<a href="#p${num}" class="anchor-link">>>${num}</a>`;
            });
            element.innerHTML = text;
        }

        document.querySelectorAll('.post-content').forEach(processPostContent);

        setInterval(async () => {
            try {
                const response = await fetch(`/api/thread/{{ thread.id }}/updates?last_id=${lastReplyId}`);
                const data = await response.json();
                
                if (data.active_count !== undefined) {
                    const countElem = document.getElementById('active-user-count');
                    if (countElem) countElem.textContent = data.active_count;
                }

                let hasNewReply = false;
                let currentCount = document.querySelectorAll('.post-item').length;

                data.replies.forEach(reply => {
                    lastReplyId = Math.max(lastReplyId, reply.id);
                    currentCount++;

                    const container = document.getElementById('post-container');
                    const newDiv = document.createElement('div');
                    newDiv.className = 'post-item';
                    newDiv.id = `p${currentCount}`;
                    newDiv.setAttribute('data-id', reply.id);

                    let deleteButtonHtml = '';
                    if (data.is_admin_user) {
                        deleteButtonHtml = `
                            <form action="/thread/{{ thread.id }}/delete_reply/${reply.id}" method="POST" style="display: inline; margin-left: 10px;" onsubmit="return confirm('このレスを削除しますか？');">
                                <button type="submit" style="background-color: #ffcccc; color: #cc0000; border: 1px solid #cc0000; border-radius: 3px; font-size: 10px; padding: 1px 5px; cursor: pointer;">削除</button>
                            </form>
                        `;
                    }

                    let imageHtml = '';
                    if (reply.image_url) {
                        imageHtml = `
                            <div style="margin-left: 2em;">
                                <img src="${reply.image_url}" class="uploaded-image" alt="添付画像">
                            </div>
                        `;
                    }
                    
                    newDiv.innerHTML = `
                        <span class="post-meta">
                            <span class="post-num">${currentCount}</span> ：
                            <span class="${reply.is_admin ? 'admin-name' : 'post-name'}">${reply.author}</span> ：
                            ${reply.date}
                            <span class="post-id"> ID:${reply.user_id}</span>
                            ${deleteButtonHtml}
                        </span>
                        <p class="post-content">${reply.content}</p>
                        ${imageHtml}
                        <hr style="border:0; border-top:1px solid #ccc;">
                    `;
                    container.appendChild(newDiv);
                    hasNewReply = true;
                    
                    const newPostContent = newDiv.querySelector('.post-content');
                    processPostContent(newPostContent);
                });

                if (hasNewReply) {
                    scrollToBottom();
                }
            } catch (error) {
                console.error('Auto update error:', error);
            }
        }, 3000);
    </script>
</body>
</html>
