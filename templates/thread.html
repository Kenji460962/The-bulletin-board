<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ thread.title }}</title>
    <style>
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; }
        a:link { color: #0000ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        form { background-color: #f0f0f0; border: 2px outset #ccc; padding: 15px; width: 450px; margin-top: 30px; }
        .post-meta { font-weight: bold; }
        .post-num { color: green; }
        .post-name { color: blue; }
        .admin-name { color: red; font-weight: bold; }
        .post-id { color: gray; font-size: 13px; font-weight: normal; }
        .post-content { margin-left: 2em; margin-top: 5px; white-space: pre-wrap; }
        .anchor-link { color: #ff00ff !important; font-weight: bold; }
        
        .uploaded-image {
            display: block;
            max-width: 300px;
            max-height: 300px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .delete-btn {
            background-color: #ffcccc;
            color: #cc0000;
            border: 1px solid #cc0000;
            border-radius: 3px;
            font-size: 11px;
            padding: 1px 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .delete-btn:hover { background-color: #ff9999; }
        .delete-form { display: inline; background: none; border: none; padding: 0; margin: 0; width: auto; }
        
        /* 🔄 アップロード中のぐるぐる表示用 */
        .loading-text { color: #555; font-size: 12px; font-weight: bold; display: none; }
    </style>
</head>
<body>

    <a href="{{ url_for('index') }}">■板一覧に戻る</a>
    
    <h1>{{ thread.title }}</h1>
    <hr>

    <div id="post-container">
        {% for reply in thread.replies %}
        <div class="post-item" id="p{{ reply.id }}" data-id="{{ reply.id }}">
            <span class="post-meta">
                <span class="post-num">{{ reply.id }}</span> ：
                <span class="{% if reply.is_admin %}admin-name{% else %}post-name{% endif %}">{{ reply.author }}</span> ：
                {{ reply.date }}
                <span class="post-id"> ID:{{ reply.user_id }}</span>
                
                {% if is_admin_user and reply.author != "あぼーん" %}
                <form class="delete-form" action="/thread/{{ thread.id }}/delete/{{ reply.id }}" method="POST" onsubmit="return confirm('このレスを本当に削除しますか？');">
                    <button type="submit" class="delete-btn">削除</button>
                </form>
                {% endif %}
            </span>
            <p class="post-content">{{ reply.content }}</p>
            <hr>
        </div>
        {% endfor %}
    </div>

    <!-- 💡 送信ボタンが押されたときに JavaScript を動かす設定にしました -->
    <form id="bbs-form" action="{{ url_for('thread_view', thread_id=thread.id) }}" method="POST">
        <h3>この板に書き込む</h3>
        名前：<input type="text" name="author" placeholder="名前#パスワード で管理者化"><br><br>
        本文：<br>
        <textarea id="form-content" name="content" rows="4" cols="50" placeholder="メッセージを入力してください"></textarea><br><br>
        
        <!-- 📸 写真選択ボタン -->
        写真：<input type="file" id="form-image" accept="image/*"><br>
        <span id="loading-msg" class="loading-text">⏳ 画像をアップロード中...しばらくお待ちください</span><br><br>
        
        <button type="submit" id="submit-btn">書き込む</button>
    </form>

    <script>
        const threadId = {{ thread.id }};
        let isAdminView = {{ 'true' if is_admin_user else 'false' }};

        // フォーム送信時に、JavaScriptで自動画像アップロードを行う機能
        document.getElementById('bbs-form').addEventListener('submit', async function(e) {
            const imageInput = document.getElementById('form-image');
            const contentInput = document.getElementById('form-content');
            const loadingMsg = document.getElementById('loading-msg');
            const submitBtn = document.getElementById('submit-btn');

            if (imageInput.files.length > 0) {
                e.preventDefault(); // 通常の送信を一時ストップ
                
                loadingMsg.style.display = 'inline';
                submitBtn.disabled = true;

                const formData = new FormData();
                formData.append('file', imageInput.files[0]); // 1枚目の画像を取得
                formData.append('upload_preset', 'sewcyaky'); 

                try {
                    // 🟢 ここにあなたのID「dpqh2ssnh」がバッチリ入っています！
                    const response = await fetch('https://cloudinary.com', {
                        method: 'POST',
                        body: formData
                    });
                    const imgData = await response.json();
                    
                    if (imgData.secure_url) {
                        contentInput.value = contentInput.value + "\n" + imgData.secure_url;
                    }
                } catch (error) {
                    alert('画像のアップロードに失敗しました。本文のみ送信します。');
                }

                this.submit(); // ストップしていた送信を再開
            }
        });

        function processPostContent(element) {
            let text = element.innerHTML;
            
            const anchorRegex = /&gt;&gt;(\d+)|>>(\d+)/g;
            text = text.replace(anchorRegex, (match, p1, p2) => {
                const num = p1 || p2;
                return `<a href="#p${num}" class="anchor-link">>>${num}</a>`;
            });

            const rawText = element.innerText;
            const imageRegex = /(https?:\/\/[\w\/:%#\$&\?\(\)~\.=\+\-]+(?:\.jpg|\.jpeg|\.png|\.gif)(?:\?[\w\/:%#\$&\?\(\)~\.=\+\-]+)?|https?:\/\/res\.cloudinary\.com\/[\w\/:%#\$&\?\(\)~\.=\+\-]+)/gi;
            
            element.innerHTML = text;

            const matches = rawText.match(imageRegex);
            if (matches) {
                matches.forEach(url => {
                    if (!element.querySelector(`img[src="${url}"]`)) {
                        const img = document.createElement('img');
                        img.src = url;
                        img.className = 'uploaded-image';
                        element.appendChild(img);
                    }
                });
            }
        }

        document.querySelectorAll('.post-content').forEach(processPostContent);
        
        setInterval(async () => {
            const postItems = document.querySelectorAll('.post-item');
            let lastId = 0;
            if (postItems.length > 0) {
                lastId = parseInt(postItems[postItems.length - 1].getAttribute('data-id'));
            }
            
            try {
                const response = await fetch(`/api/thread/${threadId}/updates?last_id=${lastId}`);
                const data = await response.json();
                
                if (data.is_admin_user !== undefined) {
                    isAdminView = data.is_admin_user;
                }
                
                data.replies.forEach(reply => {
                    const container = document.getElementById('post-container');
                    const newDiv = document.createElement('div');
                    newDiv.className = 'post-item';
                    newDiv.id = `p${reply.id}`;
                    newDiv.setAttribute('data-id', reply.id);
                    
                    const nameClass = reply.is_admin ? 'admin-name' : 'post-name';
                    
                    let deleteButtonHtml = '';
                    if (isAdminView && reply.author !== 'あぼーん') {
                        deleteButtonHtml = `
                            <form class="delete-form" action="/thread/${threadId}/delete/${reply.id}" method="POST" onsubmit="return confirm('このレスを本当に削除しますか？');">
                                <button type="submit" class="delete-btn">削除</button>
                            </form>
                        `;
                    }
                    
                    newDiv.innerHTML = `
                        <span class="post-meta">
                            <span class="post-num">${reply.id}</span> ：
                            <span class="${nameClass}">${reply.author}</span> ：
                            ${reply.date}
                            <span class="post-id"> ID:${reply.user_id}</span>
                            ${deleteButtonHtml}
                        </span>
                        <p class="post-content">${reply.content}</p>
                        <hr>
                    `;
                    
                    const contentEl = newDiv.querySelector('.post-content');
                    processPostContent(contentEl);
                    container.appendChild(newDiv);
                });
            } catch (error) {
                console.error("更新の取得に失敗しました:", error);
            }
        }, 2000);
    </script>



</body>
</html>
