<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポイント獲得 - talk-ch</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #0f1117; color: #eee; }
    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2d36; }
    .header h1 { font-size: 18px; margin: 0; }
    .points-badge { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 999px; font-weight: bold; font-size: 14px; }
    .wall-frame { width: 100%; height: calc(100vh - 60px); border: 0; display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ポイントを貯める</h1>
    <div class="points-badge">保有ポイント: {{ points }}</div>
  </div>
  <iframe
    class="wall-frame"
    src="https://api.adgem.com/v1/wall?appid={{ adgem_app_id }}&playerid={{ adgem_player_id }}"
    allow="fullscreen">
  </iframe>
</body>
</html>
