<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.webp') }}" type="image/webp">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ゲームハブ - talk-ch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        (function() {
            var saved = localStorage.getItem('talk_ch_theme');
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: rgba(15, 23, 42, 0.8);
            --bg-card: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.12);
            --border-highlight: rgba(56, 189, 248, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-cyan: #38bdf8;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        html[data-theme="light"] {
            --bg-base: #f1f5f9;
            --bg-surface: rgba(255, 255, 255, 0.9);
            --bg-card: rgba(255, 255, 255, 0.95);
            --border: rgba(0, 0, 0, 0.1);
            --border-highlight: rgba(2, 132, 199, 0.5);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-cyan: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
                url("{{ url_for('static', filename='bg-space.webp') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 560px;
        }

        .top-nav {
            margin-bottom: 20px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-back:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .header-panel {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .game-card:hover {
            border-color: var(--border-highlight);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
        }

        .game-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(99, 102, 241, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .game-info h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .game-info p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="/" class="btn-back">← talk-ch に戻る</a>
        </div>

        <div class="header-panel">
            <h1>🎮 オンラインゲーム</h1>
            <p class="sub">合言葉で友達と対戦！登録不要・完全匿名でブラウザ対戦が楽しめます。</p>
        </div>

        <div class="game-list">
            <a class="game-card" href="{{ url_for('game_lobby') }}">
                <div class="game-icon-box">⚫⚪</div>
                <div class="game-info">
                    <h2>オンラインオセロ</h2>
                    <p>部屋を作って合言葉を共有、リアルタイムで白熱のオセロ対局！</p>
                </div>
            </a>
            
            <a class="game-card" href="{{ url_for('chess_lobby') }}">
                <div class="game-icon-box">♟️👑</div>
                <div class="game-info">
                    <h2>オンラインチェス</h2>
                    <p>チェック・チェックメイト・キャスリングに対応した本格チェス対局！</p>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
