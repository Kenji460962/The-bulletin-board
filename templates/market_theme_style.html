{# 取引所で購入・適用した壁紙/フォントを反映する（適用中の場合のみ出力）。</head>の直前でincludeする。 #}
{% if market_theme %}
<style>
{% if market_theme.font %}
  @font-face { font-family: 'TalkchMarketFont'; src: url("{{ market_theme.font|e }}") format("{{ market_theme.font_format }}"); font-display: swap; }
  body, button, input, select, textarea { font-family: 'TalkchMarketFont', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif; }
{% endif %}
{% if market_theme.wallpaper %}
  :root, :root[data-theme="dark"] { --bg-image: url("{{ market_theme.wallpaper|e }}"); }
{% endif %}
</style>
{% endif %}
