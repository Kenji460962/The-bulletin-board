<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンラインチェス - talk-ch</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        a { color: var(--accent-color); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .top-nav { width: 100%; max-width: 480px; margin-bottom: 12px; font-size: 14px; }
        .container { width: 100%; max-width: 480px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; margin-top: 0; margin-bottom: 16px; text-align: center; }
        
        .status-box { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: center; font-size: 14px; }
        .players-info { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: var(--text-muted); }
        
        /* チェス盤のデザイン */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .square.light { background: #cbd5e1; }
        .square.dark { background: #64748b; }
        .square.selected { background: rgba(56, 189, 248, 0.5) !important; }
        .square.possible-move::after {
            content: '';
            width: 14px;
            height: 14px;
            background: rgba(56, 189, 248, 0.7);
            border-radius: 50%;
            position: absolute;
        }

        /* Unicode駒のスタイル */
        .piece-symbol {
            font-size: min(8vw, 36px);
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5));
            transition: transform 0.1s ease;
        }
        .square:hover .piece-symbol {
            transform: scale(1.05);
        }
        .piece-symbol.piece-white {
            color: #f8fafc;
            -webkit-text-stroke: 1px #0f172a;
        }
        .piece-symbol.piece-black {
            color: #0f172a;
            -webkit-text-stroke: 1px #cbd5e1;
        }

        .controls { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
        button { background: var(--border-color); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover { background: var(--accent-hover); }
        .link-share { display: flex; gap: 8px; margin-top: 16px; }
        .link-share input { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; color: var(--text-main); font-size: 13px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="/">← ホームに戻る</a>
    </div>

    <div class="container">
        <h1>オンラインチェス</h1>

        <div class="players-info">
            <span id="player-white">白: 待機中...</span>
            <span id="player-black">黒: 待機中...</span>
        </div>

        <div class="status-box" id="status-indicator">
            対局の準備中...
        </div>

        <div class="board" id="chess-board"></div>

        <div class="link-share">
            <input type="text" id="share-url" readonly value="">
            <button id="copy-link-btn">招待リンクコピー</button>
        </div>
    </div>

    {% if room_code %}
    <script>
        const roomCode = "{{ room_code }}";
        document.getElementById('share-url').value = window.location.href;

        let myColor = null;
        let selectedSquare = null;
        let boardState = null;
        let possibleMoves = [];

        // Unicodeのチェス駒マップ
        const PIECE_SYMBOLS = {
            'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟'
        };

        function pieceMarkup(pieceType, colorClass) {
            const symbol = PIECE_SYMBOLS[pieceType] || '';
            return `<div class="piece-symbol ${colorClass}">${symbol}</div>`;
        }

        // 盤面描画
        function renderBoard(board, data) {
            boardState = board;
            const boardEl = document.getElementById('chess-board');
            boardEl.innerHTML = '';

            const isMyTurn = data && data.turn === myColor;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    const isLight = (r + c) % 2 === 0;
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    
                    const squareNotation = String.fromCharCode(97 + c) + (8 - r);
                    square.dataset.row = r;
                    square.dataset.col = c;
                    square.dataset.notation = squareNotation;

                    // 選択状態の反映
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        square.classList.add('selected');
                    }

                    // 移動可能位置の反映
                    if (possibleMoves.includes(squareNotation)) {
                        square.classList.add('possible-move');
                    }

                    // 駒の配置
                    const piece = board[r][c];
                    if (piece) {
                        const pieceColor = piece === piece.toUpperCase() ? 'w' : 'b';
                        const pieceType = piece.toUpperCase();
                        const colorClass = pieceColor === 'w' ? 'piece-white' : 'piece-black';
                        
                        square.innerHTML = pieceMarkup(pieceType, colorClass);
                    }

                    // クリックイベント
                    square.addEventListener('click', () => handleSquareClick(r, c, squareNotation, piece, isMyTurn));

                    boardEl.appendChild(square);
                }
            }
        }

        async function handleSquareClick(r, c, notation, piece, isMyTurn) {
            if (!isMyTurn) return;

            const pieceColor = piece ? (piece === piece.toUpperCase() ? 'w' : 'b') : null;

            if (selectedSquare) {
                if (selectedSquare.r === r && selectedSquare.c === c) {
                    // 選択解除
                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard(boardState, { turn: myColor });
                    return;
                }

                if (pieceColor === myColor) {
                    // 自分の別の駒を選択し直す
                    selectedSquare = { r, c, notation };
                    fetchPossibleMoves(notation);
                    return;
                }

                // 移動実行
                makeMove(selectedSquare.notation, notation);
            } else {
                if (pieceColor === myColor) {
                    selectedSquare = { r, c, notation };
                    fetchPossibleMoves(notation);
                }
            }
        }

        async function fetchPossibleMoves(notation) {
            try {
                const res = await fetch(`/api/chess/${roomCode}/moves?square=${notation}`);
                if (res.ok) {
                    const data = await res.json();
                    possibleMoves = data.moves || [];
                    renderBoard(boardState, { turn: myColor });
                }
            } catch (e) {
                console.error('移動可能位置の取得エラー:', e);
            }
        }

        async function makeMove(from, to) {
            try {
                const res = await fetch(`/api/chess/${roomCode}/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from, to })
                });
                if (res.ok) {
                    selectedSquare = null;
                    possibleMoves = [];
                    fetchState();
                }
            } catch (e) {
                console.error('移動エラー:', e);
            }
        }

        function updatePlayersBox(data) {
            const whiteEl = document.getElementById('player-white');
            const blackEl = document.getElementById('player-black');
            whiteEl.textContent = `白: ${data.white || '待機中...'}`;
            blackEl.textContent = `黒: ${data.black || '待機中...'}`;
        }

        function updateStatusBar(data) {
            const indicator = document.getElementById('status-indicator');
            if (data.status === 'waiting') {
                indicator.textContent = '対戦相手を待っています...（リンクを共有してください）';
                indicator.style.color = 'var(--text-muted)';
            } else if (data.status === 'ended') {
                indicator.textContent = `ゲーム終了: ${data.result || ''}`;
                indicator.style.color = 'var(--accent-color)';
            } else {
                const checkNote = data.in_check ? ' (王手！)' : '';
                if (data.turn === myColor) {
                    indicator.textContent = `あなたのターンです${checkNote}`;
                    indicator.style.color = 'var(--accent-color)';
                } else {
                    indicator.textContent = `相手のターンです${checkNote}`;
                    indicator.style.color = 'var(--text-muted)';
                }
            }
        }

        async function fetchState() {
            try {
                const res = await fetch(`/api/chess/${roomCode}/state`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.my_color) myColor = data.my_color;

                updatePlayersBox(data);
                updateStatusBar(data);
                if (data.board) {
                    renderBoard(data.board, data);
                }
            } catch (e) {
                console.error('状態取得エラー:', e);
            }
        }

        document.getElementById('copy-link-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById('copy-link-btn');
                const original = btn.textContent;
                btn.textContent = 'コピーしました';
                setTimeout(() => { btn.textContent = original; }, 1500);
            });
        });

        fetchState();
        setInterval(fetchState, 2000);
    </script>
    {% endif %}

</body>
</html>
