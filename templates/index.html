<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bulletin Board</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
        }

        /* Thread List */
        .thread-section {
            display: none;
        }

        .thread-section.active {
            display: block;
        }

        .thread-list {
            display: grid;
            gap: 10px;
            margin-bottom: 20px;
        }

        .thread-item {
            background-color: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .thread-item:hover {
            background-color: #f9f9f9;
        }

        .thread-info {
            flex: 1;
        }

        .thread-title {
            font-size: 16px;
            font-weight: bold;
            color: #0066cc;
        }

        .thread-meta {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .thread-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            margin-left: 10px;
        }

        .thread-delete:hover {
            background-color: #c0392b;
        }

        /* Thread View */
        .thread-view {
            display: none;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .thread-view.active {
            display: block;
        }

        .thread-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .thread-header h2 {
            font-size: 20px;
        }

        .back-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
        }

        .back-button:hover {
            background-color: #2980b9;
        }

        .posts-list {
            margin-bottom: 20px;
        }

        .post {
            background-color: #f9f9f9;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 3px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .post-number {
            background-color: #3498db;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
        }

        .post-time {
            font-size: 12px;
            color: #999;
        }

        .post-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .post-delete:hover {
            background-color: #c0392b;
        }

        .post-text {
            margin-bottom: 10px;
            line-height: 1.5;
            word-break: break-word;
        }

        .post-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 3px;
            margin-top: 10px;
        }

        /* Form */
        .form-section {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .form-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input[type="file"] {
            padding: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #27ae60;
            color: white;
        }

        .btn-primary:hover {
            background-color: #229954;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .error {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        .success {
            background-color: #27ae60;
            color: white;
            padding: 10px;
            border-radius: 3px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📌 The Bulletin Board</h1>
            <p>2ちゃんねる風掲示板</p>
        </header>

        <!-- Thread List Section -->
        <div id="threadListSection" class="thread-section active">
            <div class="form-section">
                <h3>新しいスレッドを作成</h3>
                <div id="threadErrorMsg"></div>
                <div class="form-group">
                    <label for="threadTitle">スレッドタイトル:</label>
                    <input type="text" id="threadTitle" placeholder="スレッドのタイトルを入力してください">
                </div>
                <button class="btn-primary" onclick="createThread()">スレッド作成</button>
            </div>

            <div class="form-section">
                <h3>スレッド一覧</h3>
                <div id="threadList" class="thread-list"></div>
            </div>
        </div>

        <!-- Thread View Section -->
        <div id="threadViewSection" class="thread-view">
            <div class="thread-header">
                <h2 id="threadTitle"></h2>
                <button class="back-button" onclick="backToThreadList()">← スレッド一覧に戻る</button>
            </div>

            <div id="threadErrorMsg2"></div>

            <div class="posts-list" id="postsList"></div>

            <div class="form-section">
                <h3>新しいレスを投稿</h3>
                <div id="postErrorMsg"></div>
                <form id="postForm" onsubmit="createPost(event)">
                    <div class="form-group">
                        <label for="postText">本文:</label>
                        <textarea id="postText" placeholder="投稿内容を入力してください"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="postImage">画像 (オプション):</label>
                        <input type="file" id="postImage" accept="image/*">
                    </div>
                    <button type="submit" class="btn-primary">投稿</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentThreadId = null;

        // Load threads on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadThreads();
        });

        // Load threads from server
        async function loadThreads() {
            try {
                const response = await fetch('/api/threads');
                const threads = await response.json();
                
                const threadList = document.getElementById('threadList');
                threadList.innerHTML = '';
                
                if (threads.length === 0) {
                    threadList.innerHTML = '<p style="text-align: center; color: #999;">スレッドがまだ作成されていません</p>';
                    return;
                }
                
                threads.forEach(thread => {
                    const threadItem = document.createElement('div');
                    threadItem.className = 'thread-item';
                    threadItem.innerHTML = `
                        <div class="thread-info" onclick="viewThread(${thread.id})">
                            <div class="thread-title">${escapeHtml(thread.title)}</div>
                            <div class="thread-meta">投稿数: ${thread.post_count}</div>
                        </div>
                        <button class="thread-delete" onclick="deleteThread(${thread.id}, event)">削除</button>
                    `;
                    threadList.appendChild(threadItem);
                });
            } catch (error) {
                console.error('Error loading threads:', error);
            }
        }

        // Create new thread
        async function createThread() {
            const title = document.getElementById('threadTitle').value.trim();
            const errorMsg = document.getElementById('threadErrorMsg');
            
            if (!title) {
                errorMsg.innerHTML = '<div class="error">タイトルを入力してください</div>';
                return;
            }
            
            try {
                const response = await fetch('/api/threads', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title: title })
                });
                
                if (response.ok) {
                    document.getElementById('threadTitle').value = '';
                    errorMsg.innerHTML = '<div class="success">スレッドを作成しました</div>';
                    setTimeout(() => {
                        errorMsg.innerHTML = '';
                        loadThreads();
                    }, 1000);
                } else {
                    errorMsg.innerHTML = '<div class="error">スレッド作成に失敗しました</div>';
                }
            } catch (error) {
                console.error('Error creating thread:', error);
                errorMsg.innerHTML = '<div class="error">エラーが発生しました</div>';
            }
        }

        // View thread
        async function viewThread(threadId) {
            currentThreadId = threadId;
            document.getElementById('threadListSection').classList.remove('active');
            document.getElementById('threadViewSection').classList.add('active');
            
            try {
                const response = await fetch(`/api/threads/${threadId}/posts`);
                const thread = await fetch(`/api/threads`).then(r => r.json()).then(t => t.find(th => th.id === threadId));
                
                document.getElementById('threadTitle').textContent = thread ? escapeHtml(thread.title) : 'スレッド';
                
                const posts = await response.json();
                const postsList = document.getElementById('postsList');
                postsList.innerHTML = '';
                
                posts.forEach(post => {
                    const postDiv = document.createElement('div');
                    postDiv.className = 'post';
                    
                    let imageHtml = '';
                    if (post.image_data) {
                        imageHtml = `<img src="data:image/jpeg;base64,${post.image_data}" class="post-image" alt="投稿画像">`;
                    }
                    
                    postDiv.innerHTML = `
                        <div class="post-header">
                            <span class="post-number">&gt;&gt;${post.post_number}</span>
                            <span class="post-time">${new Date(post.created_at).toLocaleString('ja-JP')}</span>
                            <button class="post-delete" onclick="deletePost(${post.id})">削除</button>
                        </div>
                        <div class="post-text">${escapeHtml(post.text)}</div>
                        ${imageHtml}
                    `;
                    postsList.appendChild(postDiv);
                });
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }

        // Back to thread list
        function backToThreadList() {
            currentThreadId = null;
            document.getElementById('threadViewSection').classList.remove('active');
            document.getElementById('threadListSection').classList.add('active');
            loadThreads();
        }

        // Create new post
        async function createPost(event) {
            event.preventDefault();
            
            const text = document.getElementById('postText').value.trim();
            const image = document.getElementById('postImage').files[0];
            const errorMsg = document.getElementById('postErrorMsg');
            
            if (!text && !image) {
                errorMsg.innerHTML = '<div class="error">本文または画像を入力してください</div>';
                return;
            }
            
            const formData = new FormData();
            formData.append('text', text);
            if (image) {
                formData.append('image', image);
            }
            
            try {
                const response = await fetch(`/api/threads/${currentThreadId}/posts`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    document.getElementById('postForm').reset();
                    errorMsg.innerHTML = '<div class="success">投稿しました</div>';
                    setTimeout(() => {
                        errorMsg.innerHTML = '';
                        viewThread(currentThreadId);
                    }, 500);
                } else {
                    errorMsg.innerHTML = '<div class="error">投稿に失敗しました</div>';
                }
            } catch (error) {
                console.error('Error creating post:', error);
                errorMsg.innerHTML = '<div class="error">エラーが発生しました</div>';
            }
        }

        // Delete post
        async function deletePost(postId) {
            if (confirm('このレスを削除してもよろしいですか？')) {
                try {
                    const response = await fetch(`/api/posts/${postId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        viewThread(currentThreadId);
                    } else {
                        alert('削除に失敗しました');
                    }
                } catch (error) {
                    console.error('Error deleting post:', error);
                    alert('エラーが発生しました');
                }
            }
        }

        // Delete thread
        async function deleteThread(threadId, event) {
            event.stopPropagation();
            if (confirm('このスレッドを削除してもよろしいですか？')) {
                try {
                    const response = await fetch(`/api/threads/${threadId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        loadThreads();
                    } else {
                        alert('削除に失敗しました');
                    }
                } catch (error) {
                    console.error('Error deleting thread:', error);
                    alert('エラーが発生しました');
                }
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
