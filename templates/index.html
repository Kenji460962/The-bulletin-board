<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <link rel="icon" href="{{ url_for('static', filename='favicon2.png') }}" type="image/png">
       
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3410577348918125"
     crossorigin="anonymous"></script>
    
    
    <title> talk-ch トークちゃんねる </title>
    <style>
        body { 
            background-image: url("{{ url_for('static', filename='0935f37c-49c6-4db0-bcdc-17889d7918e4.jpeg') }}"); 
            background-size: cover;          /* 画面いっぱいに広げる */
            background-position: center;     /* 中央寄せ */
            background-attachment: fixed;    /* スクロールしても背景を固定 */
            color: #ffffff;                  
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "MS P Gothic", sans-serif; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }


        /* タイトルのデザイン*/
                /* タイトルのデザイン（大きく・目立つように強化！） */
        h1 {
            font-size: 36px;                 /* 文字サイズを大きく */
            font-weight: 900;                /* めっちゃ太字 */
            color: #ffffff;                  /* 文字色を白に */
            text-align: center;              /* 中央寄せ */
            margin-top: 20px;
            margin-bottom: 25px;
            
            /* 文字に黒い影（ネオン風）をつけて、どんな背景でも浮き上がって見えるようにする */
            text-shadow: 
                0 0 10px rgba(0, 0, 0, 0.9),
                2px 2px 4px rgba(0, 0, 0, 0.8),
                -2px -2px 4px rgba(0, 0, 0, 0.8);
            
            letter-spacing: 2px;             /* 文字同士の間隔を少し広げておしゃれに */
        }

        /* 共通ボタン（ネオン風） */
        button, input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,123,255,0.5);
            transition: all 0.3s ease;
        }

        button:hover, input[type="submit"]:hover {
            background-color: #0056b3;
            box-shadow: 0 0 15px rgba(0,123,255,0.8);
        }

        /* 入力フォームのデザイン */
        input[type="text"], input[type="number"], textarea {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            box-sizing: border-box;
            background-color: rgba(255, 255, 255, 0.9);
            color: #000;
        }

        /* リンクのデザイン */
        a {
            color: #00ffff; /* ネオンブルー */
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        /* タブメニューのデザイン */
        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #007bff;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: none;
        }

        .menu-btn.active {
            background-color: #007bff;
            box-shadow: 0 0 10px rgba(0,123,255,0.8);
        }

        /* 表示・非表示の切り替え */
        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }
    </style>
</head>
<body>

    <h1> talk-ch トークちゃんねる </h1>

    <div class="tab-menu">
        <button class="menu-btn active" onclick="switchTab('create-tab', this)">新規スレ作成</button>
        <button class="menu-btn" onclick="switchTab('threads-tab', this)">スレ一覧</button>
    </div>

    <div id="create-tab" class="content-section active">
        <h2>新規スレッド作成</h2>
        <form id="create-thread-form" action="{{ url_for('create_thread') }}" method="POST">
            <div>
                <label for="title">スレッド名:</label><br>
                <input type="text" id="title" name="title" required placeholder="スレッドのタイトルを入力">
            </div>
            <div>
                <label for="content">1の書き込み（本文）:</label><br>
                <textarea id="content" name="content" rows="4" required placeholder="最初の書き込み内容を入力"></textarea>
            </div>
            <button type="submit">スレッドを作成する</button>
        </form>
    </div>

    <div id="threads-tab" class="content-section">
        <h2>いま立っている板一覧</h2>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px;">

        <div style="margin-bottom: 20px;">
            <div>
                <label for="threadSearchInput">スレッド検索:</label><br>
                <input type="text" id="threadSearchInput" onkeyup="filterThreads()" placeholder="スレッドのタイトルを入力">
            </div>
            <div style="margin-top: 10px;">
                <label for="jumpThreadIdInput">スレッド番号指定移動:</label><br>
                <div style="display: flex; gap: 10px; max-width: 500px; align-items: flex-start;">
                    <input type="number" id="jumpThreadIdInput" placeholder="スレッド番号を入力" style="margin-bottom: 0;">
                    <button type="button" onclick="jumpToThread()" style="white-space: nowrap;">移動</button>
                </div>
            </div>
        </div>

        <ul id="thread-list" style="list-style: none; padding: 0;">
            {% for thread in threads %}
            <li class="thread-item" style="display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin-bottom: 12px;">
                <div>
                    <span style="color: #aaa; font-size: 14px; margin-right: 8px;">#{{ thread.id }}</span>
                    <a href="{{ url_for('thread_view', thread_id=thread.id) }}" style="font-size: 18px;">{{ thread.title }}</a>
                </div>
                {% if is_admin_user %}
                <form action="{{ url_for('delete_thread', thread_id=thread.id) }}" method="POST" onsubmit="return confirm('本当に削除しますか？');" style="margin: 0;">
                    <button type="submit" style="background-color: #ff4d4d; padding: 4px 8px; font-size: 12px; border-radius: 3px;">削除</button>
                </form>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        document.getElementById('create-thread-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            try {
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    const threadList = document.getElementById('thread-list');
                    if (threadList) {
                        const newLi = document.createElement('li');
                        newLi.className = 'thread-item';
                        newLi.style.cssText = "display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin-bottom: 12px;";
                        
                        let deleteButtonHtml = '';
                        {% if is_admin_user %}
                        deleteButtonHtml = `
                            <form action="/delete_thread/${result.thread_id}" method="POST" onsubmit="return confirm('本当に削除しますか？');" style="margin: 0;">
                                <button type="submit" style="background-color: #ff4d4d; padding: 4px 8px; font-size: 12px; border-radius: 3px;">削除</button>
                            </form>
                        `;
                        {% endif %}

                        newLi.innerHTML = `
                            <div>
                                <span style="color: #aaa; font-size: 14px; margin-right: 8px;">#${result.thread_id}</span>
                                <a href="/thread/${result.thread_id}" style="font-size: 18px;">${escapeHtml(formData.get('title'))}</a>
                            </div>
                            ${deleteButtonHtml}
                        `;
                        threadList.insertBefore(newLi, threadList.firstChild);
                    }
                    
                    this.reset();
                    var threadTabBtn = document.querySelectorAll('.menu-btn')[1];
                    switchTab('threads-tab', threadTabBtn);
                } else {
                    alert(result.error || 'スレッドの作成に失敗しました。');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('通信エラーが発生しました。');
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#39;');
        }

        function switchTab(tabId, buttonElement) {
            var sections = document.querySelectorAll('.content-section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            var buttons = document.querySelectorAll('.menu-btn');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].classList.remove('active');
            }
            var targetSection = document.getElementById(tabId);
            if (targetSection) {
                targetSection.classList.add('active');
            }
            if (buttonElement) {
                buttonElement.classList.add('active');
            }
        }

        // スレッド絞り込み関数
        function filterThreads() {
            const input = document.getElementById('threadSearchInput').value.toLowerCase();
            const threads = document.querySelectorAll('.thread-item');

            threads.forEach(thread => {
                const text = thread.textContent.toLowerCase();
                if (text.includes(input)) {
                    thread.style.display = "flex";
                } else {
                    thread.style.display = "none";
                }
            });
        }

        // スレッド番号移動関数
        function jumpToThread() {
            const input = document.getElementById('jumpThreadIdInput');
            if (!input) return;
            const threadId = input.value.trim();
            if (!threadId) return;
            window.location.href = `/thread/${threadId}`;
        }

        window.addEventListener('load', function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'threads') {
                var btns = document.querySelectorAll('.menu-btn');
                for (var k = 0; k < btns.length; k++) {
                    if (btns[k].textContent.trim() === 'スレ一覧') {
                        switchTab('threads-tab', btns[k]);
                    }
                }
            }

            const jumpInput = document.getElementById('jumpThreadIdInput');
            if (jumpInput) {
                jumpInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        jumpToThread();
                    }
                });
            }
        });
    </script>
</body>
</html>
