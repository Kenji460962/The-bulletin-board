<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon2.png') }}" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3410577348918125" crossorigin="anonymous"></script>
    
    <title>talk-ch トークちゃんねる</title>
    <style>
        body { 
            background-image: url("{{ url_for('static', filename='0935f37c-49c6-4db0-bcdc-17889d7918e4.jpeg') }}"); 
            background-size: cover;          
            background-position: center;     
            background-attachment: fixed;    
            color: #ffffff;                  
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "MS P Gothic", sans-serif; 
            padding: 20px; 
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 15px;
            text-align: center;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .menu-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .menu-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li.thread-item {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px 14px;
            transition: background-color 0.2s;
        }

        li.thread-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        a {
            color: #38bdf8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        input[type="text"], input[type="number"], textarea {
            background-color: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            padding: 8px 10px;
            outline: none;
            font-size: 14px;
        }

        button.submit-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 4px;
            padding: 8px 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.submit-btn:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>talk-ch トークちゃんねる</h1>

        <div class="tab-menu">
            <button class="menu-btn active" onclick="switchTab('create-tab', this)">新規スレ作成</button>
            <button class="menu-btn" onclick="switchTab('threads-tab', this)">スレ一覧</button>
        </div>

        <div id="create-tab" class="content-section active">
            <form id="create-thread-form" action="{{ url_for('create_thread') }}" method="POST">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px; color: #cbd5e1;">スレッドタイトル</label>
                    <input type="text" name="title" required placeholder="タイトルを入力..." style="width: 100%; box-sizing: border-box;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 13px; margin-bottom: 4px; color: #cbd5e1;">最初の書き込み（本文）</label>
                    <textarea name="content" rows="4" required placeholder="本文を入力..." style="width: 100%; box-sizing: border-box; resize: vertical;"></textarea>
                </div>
                <button type="submit" class="submit-btn">スレッドを作成する</button>
            </form>
        </div>

        <div id="threads-tab" class="content-section">
            <h2>いま立っている板一覧</h2>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px;">

            <div style="background-color: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px;">
                <div>
                    <input type="text" id="threadSearchInput" placeholder="スレッドのタイトルで検索..." onkeyup="filterThreads()" style="width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; background-color: rgba(255, 255, 255, 0.9); color: #000; outline: none;">
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <input type="number" id="jumpThreadIdInput" placeholder="スレッド番号を入力" min="1" style="flex: 1; box-sizing: border-box; padding: 8px 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ccc; background-color: rgba(255, 255, 255, 0.9); color: #000; outline: none;">
                    <button type="button" onclick="jumpToThread()" style="background-color: #007bff; color: white; border: none; border-radius: 4px; padding: 8px 15px; font-weight: bold; cursor: pointer;">スレッドへ移動</button>
                </div>
            </div>

            <ul id="thread-list">
                {% for thread in threads %}
                <li class="thread-item" style="display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin-bottom: 12px;">
                    <div>
                        <span style="color: #94a3b8; font-size: 12px; margin-right: 6px;">#{{ thread.id }}</span>
                        <a href="{{ url_for('thread_view', thread_id=thread.id) }}" style="font-weight: 600; font-size: 15px;">{{ thread.title }}</a>
                    </div>
                    {% if is_admin_user %}
                    <form action="{{ url_for('delete_thread', thread_id=thread.id) }}" method="POST" onsubmit="return confirm('削除しますか？');" style="margin: 0;">
                        <button type="submit" style="background-color: #f43f5e; color: white; border: none; padding: 3px 8px; font-size: 11px; border-radius: 4px; cursor: pointer;">削除</button>
                    </form>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <script>
        // タブ切り替え機能
        function switchTab(tabId, buttonElement) {
            var sections = document.querySelectorAll('.content-section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active');
            }
            var buttons = document.querySelectorAll('.menu-btn');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].classList.remove('active');
            }
            var targetSection = document.getElementById(tabId);
            if (targetSection) {
                targetSection.classList.add('active');
            }
            if (buttonElement) {
                buttonElement.classList.add('active');
            }
        }

        // HTMLエスケープ処理
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#39;');
        }

        // 🔍 1. キーワードでスレッドをリアルタイム絞り込み検索する関数
        function filterThreads() {
            const input = document.getElementById('threadSearchInput').value.toLowerCase();
            const threads = document.querySelectorAll('.thread-item');

            threads.forEach(thread => {
                const text = thread.textContent.toLowerCase();
                if (text.includes(input)) {
                    thread.style.display = "flex"; 
                } else {
                    thread.style.display = "none";
                }
            });
        }

        // 🔍 2. 指定したスレッド番号に直接ジャンプする関数
        function jumpToThread() {
            const input = document.getElementById('jumpThreadIdInput');
            if (!input) return;
            const threadId = input.value.trim();
            if (!threadId) return;
            window.location.href = `/thread/${threadId}`;
        }

        // スレッド作成フォーム送信処理（Ajax）
        document.getElementById('create-thread-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);

            try {
                const response = await fetch(this.action, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    const threadList = document.getElementById('thread-list');
                    if (threadList) {
                        const newLi = document.createElement('li');
                        newLi.className = 'thread-item'; // 🔍 検索用クラス付与
                        newLi.style.cssText = "display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin-bottom: 12px;";
                        newLi.innerHTML = `
                            <div>
                                <span style="color: #94a3b8; font-size: 12px; margin-right: 6px;">#${result.thread_id}</span>
                                <a href="/thread/${result.thread_id}" style="font-weight: 600; font-size: 15px;">${escapeHtml(formData.get('title'))}</a>
                            </div>
                        `;
                        threadList.insertBefore(newLi, threadList.firstChild);
                    }
                    
                    // フォーム初期化して一覧タブに切り替え
                    this.reset();
                    var threadTabBtn = document.querySelectorAll('.menu-btn')[1];
                    switchTab('threads-tab', threadTabBtn);
                } else {
                    alert(result.error || 'スレッドの作成に失敗しました。');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('通信エラーが発生しました。');
            }
        });

        // ページ読み込み時の処理
        window.addEventListener('load', function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('tab') === 'threads') {
                var btns = document.querySelectorAll('.menu-btn');
                for (var k = 0; k < btns.length; k++) {
                    if (btns[k].textContent.trim() === 'スレ一覧') {
                        switchTab('threads-tab', btns[k]);
                    }
                }
            }

            // スレッド番号入力欄でEnterキーが押された時のジャンプ処理
            const jumpInput = document.getElementById('jumpThreadIdInput');
            if (jumpInput) {
                jumpInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        jumpToThread();
                    }
                });
            }
        });
    </script>
</body>
</html>
