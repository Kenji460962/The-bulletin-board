<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3ch 掲示板トップ</title>
    <style>
        body { background-color: #efefef; color: #000000; font-family: "MS P Gothic", sans-serif; padding: 20px; }
        a:link { color: #0000ff; } a:visited { color: #551a8b; }
        form { background-color: #f0f0f0; border: 2px outset #ccc; padding: 10px; width: 400px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>3ch 掲示板</h1>

    <!-- 新しい板を作るフォーム -->
    <form action="{{ url_for('create_thread') }}" method="POST">
        <h3>新しい板（スレッド）を立てる</h3>
        <input type="text" name="title" placeholder="スレッドのタイトルを入力" style="width: 80%;" required><br><br>
        <button type="submit">新規スレッド作成</button>
    </form>

    <hr>

    <h2>いま立っている板一覧</h2>
    <ul>
        {% for thread in threads %}
        <li>
            <a href="{{ url_for('thread_view', thread_id=thread.id) }}">
                【{{ thread.id }}】 {{ thread.title }}
            </a> 
            ({{ thread.replies|length }}レス)
        </li>
        {% else %}
        <li>まだ板がありません。新しい板を立ててみましょう！</li>
        {% endfor %}
    </ul>

</body>
</html>
